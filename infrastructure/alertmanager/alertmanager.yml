# Alertmanager config to send alerts to SYNAPSE
global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'service']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h
  receiver: 'synapse'
  routes:
    - match:
        severity: critical
      receiver: synapse
      group_wait: 5s
    - match:
        severity: warning
      receiver: synapse
      group_wait: 15s

receivers:
  - name: 'synapse'
    webhook_configs:
      - url: 'http://synapse-backend:8000/api/v1/alerts/webhook'
        send_resolved: true
        max_alerts: 10
