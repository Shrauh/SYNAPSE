global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'synapse-services'
    static_configs:
      - targets:
          - 'api-gateway:8080'
          - 'auth-service:8081'
          - 'user-service:8082'
          - 'order-service:8083'
          - 'payment-service:8085'
    metrics_path: '/metrics'
