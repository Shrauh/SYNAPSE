version: "3.9"

# ============================================================
# SYNAPSE — Docker Compose (Production-Grade)
# ============================================================
# Profiles:
#   default: api only (Kafka disabled, simulation mode)
#   kafka:   api + zookeeper + kafka + kafka-ui
#
# Usage:
#   docker-compose up                       # API only (local dev)
#   docker-compose --profile kafka up       # With Kafka

services:
  # ── SYNAPSE Backend API ──────────────────────────────────
  api:
    build: .
    container_name: synapse-backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=SYNAPSE
      - APP_VERSION=1.0.0
      - DEBUG=true
      - DATABASE_URL=sqlite+aiosqlite:///./synapse.db
      - LLM_PROVIDER=groq
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANOMALY_THRESHOLD=0.6
      - KAFKA_ENABLED=false
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - K8S_ENABLED=false
      - REMEDIATION_AUTO_EXECUTE=true
      - REMEDIATION_CONFIDENCE_THRESHOLD=0.85
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:5173"]
    volumes:
      - ./models:/app/models
      - synapse-data:/app/data
      - synapse-db:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/api/v1/health'); assert r.status_code == 200"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 20s

  # ── Zookeeper (Kafka dependency) ─────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: synapse-zookeeper
    profiles: ["kafka"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Apache Kafka 3.7 ─────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: synapse-kafka
    profiles: ["kafka"]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 20s
      timeout: 10s
      retries: 5

  # ── Kafka Topic Initializer ───────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: synapse-kafka-init
    profiles: ["kafka"]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      echo 'Creating SYNAPSE Kafka topics...'
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic metrics-topic --replication-factor 1 --partitions 4
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic logs-topic --replication-factor 1 --partitions 2
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic traces-topic --replication-factor 1 --partitions 2
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic alerts-topic --replication-factor 1 --partitions 2
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic remediation-topic --replication-factor 1 --partitions 1
      echo 'Topics created.'
      "

  # ── Kafka UI (dev dashboard) ─────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: synapse-kafka-ui
    profiles: ["kafka"]
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: synapse-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

volumes:
  synapse-data:
  synapse-db:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
