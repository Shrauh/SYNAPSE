version: '3.8'

services:
  synapse-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: synapse-backend
    ports:
      - "8000:8000"
    environment:
      - SYNAPSE_LIVE_K8S=true
    volumes:
      - ~/.kube/config:/root/.kube/config:ro
    restart: unless-stopped

  synapse-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: synapse-frontend
    ports:
      - "5173:5173"
    depends_on:
      - synapse-backend
    restart: unless-stopped
